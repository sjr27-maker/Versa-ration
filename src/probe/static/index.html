<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>versa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ── ported verbatim from "Probe UI - Calm.dc.html" ─────────────── */
body{margin:0;background:#f5f3ee;color:#1a1815;font-family:'Inter Tight',sans-serif;overflow-x:hidden}
a{color:#c2410c;text-decoration:none}
a:hover{color:#9a2f08}
*{box-sizing:border-box}
/* the HTML `hidden` attribute must always beat a class that sets display
   (.gen-overlay / .thinking-badge use display:flex, same specificity as
   the UA [hidden] rule, and win by source order without this) */
[hidden]{display:none!important}
input,button{font-family:inherit}
#probeBgCanvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;opacity:0.9;transition:opacity 0.6s ease}
#probeBgCanvas.thinking{opacity:1}
.probe-bloom{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(15,118,110,0.14) 0%,transparent 55%),radial-gradient(ellipse at 25% 78%,rgba(194,65,12,0.10) 0%,transparent 50%),radial-gradient(ellipse at 22% 22%,rgba(143,168,120,0.14) 0%,transparent 48%)}
.probe-shell{position:relative;z-index:1}
.probe-rail{background:linear-gradient(180deg,rgba(232,240,220,0.92) 0%,rgba(222,233,207,0.9) 55%,rgba(214,227,197,0.92) 100%)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset -1px 0 0 rgba(148,172,120,0.22)}
.probe-rail-glow{position:absolute;top:78px;left:50%;transform:translateX(-50%);width:74px;height:74px;background:radial-gradient(circle,rgba(255,240,190,0.85) 0%,rgba(220,230,180,0.35) 45%,transparent 72%);border-radius:50%;filter:blur(7px);pointer-events:none;animation:lightPulse 4.5s ease-in-out infinite}
@keyframes lightPulse{0%,100%{opacity:0.55;transform:translateX(-50%) scale(0.9)}50%{opacity:1;transform:translateX(-50%) scale(1.15)}}
@keyframes genFadeIn{from{opacity:0;backdrop-filter:blur(0px)}to{opacity:1;backdrop-filter:blur(4px)}}
@keyframes genTextIn{0%{opacity:0;transform:translateY(14px);letter-spacing:8px}100%{opacity:1;transform:translateY(0);letter-spacing:2px}}
@keyframes lineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.probe-panel{background:rgba(255,255,255,0.68);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.probe-inspector{background:rgba(250,247,241,0.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeScale{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:0.9}50%{transform:scale(1.1);opacity:1}}
@keyframes typingDot{0%,80%,100%{transform:translateY(0);opacity:0.3}40%{transform:translateY(-3px);opacity:1}}
@keyframes ringRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ── ported layout as concrete classes ─────────────────────────── */
.shell{display:flex;min-height:100vh}
.rail{width:78px;border-right:1px solid rgba(178,198,152,0.4);display:flex;flex-direction:column;align-items:center;padding:22px 0;flex-shrink:0;position:sticky;top:0;height:100vh;z-index:20}
.rail-logo{width:58px;height:58px;position:relative;margin-bottom:36px;z-index:2}
.rail-btn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:6px;transition:background 0.2s;z-index:2;border:none;background:transparent}
.rail-btn:hover{background:rgba(255,255,255,0.55)}
.rail-btn.active{background:rgba(230,224,211,0.7)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topstrip{padding:20px 40px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.serif{font-family:'Instrument Serif',serif;font-style:italic}
.mono{font-family:'JetBrains Mono',monospace}
.dot{width:4px;height:4px;background:#c5bfae;border-radius:50%}
.learner-chip{background:transparent;border:1px solid transparent;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a8478;padding:3px 6px;outline:none;min-width:90px;transition:border-color .15s,background .15s}
.learner-chip:hover,.learner-chip:focus{border-color:rgba(143,168,120,0.4);background:rgba(255,255,255,0.5)}
.learner-chip:disabled{opacity:1;cursor:default}
.thinking-badge{display:flex;align-items:center;gap:8px;padding:5px 12px;background:rgba(255,255,255,0.6);border:1px solid rgba(194,65,12,0.3);border-radius:20px;backdrop-filter:blur(6px);animation:fadeScale 0.25s ease-out}
.stream{flex:1;overflow-y:auto;padding:20px 40px 20px;display:flex;flex-direction:column;align-items:center}
.stream-inner{width:100%;max-width:720px;display:flex;flex-direction:column;gap:22px}
.empty-hero{min-height:calc(100vh - 260px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;animation:fadeIn 0.5s ease-out}
.empty-hero .big{font-family:'Inter Tight',sans-serif;font-weight:300;font-size:96px;line-height:0.98;letter-spacing:-3.5px;color:#1a1815}
.empty-hero .big em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:#c2410c}
.turn{display:flex;flex-direction:column;gap:16px;animation:fadeUp 0.4s ease-out both}
.q-row{display:flex;justify-content:flex-end}
.q-bubble{background:#1a1815;color:#f5f3ee;border-radius:18px 18px 4px 18px;padding:12px 18px;max-width:75%;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
.a-row{display:flex;gap:12px;align-items:flex-start;animation:fadeUp 0.4s ease-out both}
.p-avatar{width:30px;height:30px;background:rgba(255,255,255,0.7);border:1px solid #e3ded3;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-style:italic;font-size:15px;color:#c2410c;flex-shrink:0}
.a-body{flex:1;min-width:0}
.a-panel{border:1px solid #e3ded3;border-radius:4px 18px 18px 18px;padding:14px 20px;font-size:14.5px;line-height:1.6;color:#1a1815;white-space:pre-wrap}
.a-typing{border:1px solid #e3ded3;border-radius:4px 18px 18px 18px;padding:14px 20px;display:flex;gap:6px;align-items:center}
.a-typing i{width:6px;height:6px;background:#c2410c;border-radius:50%;animation:typingDot 1.2s infinite;display:block}
.trace-line{margin-top:8px;padding-left:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#8a8478;letter-spacing:0.3px;display:flex;gap:14px;flex-wrap:wrap}
.trace-line b{color:#c2410c;font-weight:400}
.trace-line .sep{color:#c5bfae}
.opt-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px;padding-left:42px}
.opt-btn{background:rgba(255,255,255,0.8);border:1px solid #d5cfc0;border-radius:12px;padding:10px 16px;font-size:13px;color:#1a1815;cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.opt-btn:hover{border-color:#c2410c;background:#fff;transform:translateY(-1px)}
.opt-btn:disabled{opacity:0.5;cursor:default}
.promptwrap{padding:16px 40px 28px;flex-shrink:0;display:flex;justify-content:center}
.promptwrap .col{width:100%;max-width:720px}
.promptbar{border:1px solid #d5cfc0;border-radius:16px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(30,41,59,0.06);transition:border-color 0.2s,box-shadow 0.2s}
.promptbar:focus-within{border-color:#c2410c;box-shadow:0 8px 30px rgba(194,65,12,0.15)}
.promptbar input{flex:1;border:none;outline:none;background:transparent;font-family:'Inter Tight',sans-serif;font-size:15px;color:#1a1815;padding:10px 0}
.send-btn{background:#c2410c;border:none;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 0.15s,transform 0.15s}
.send-btn:hover{background:#9a2f08;transform:translateY(-1px)}
.send-btn:disabled{background:#c9b8ad;cursor:default;transform:none}
.prompt-meta{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 0;font-family:'JetBrains Mono',monospace;font-size:10px;color:#8a8478;letter-spacing:0.5px}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.toggle .track{width:22px;height:12px;background:#c5bfae;border-radius:8px;position:relative;transition:background .15s}
.toggle .track .knob{width:9px;height:9px;background:#fff;border-radius:50%;position:absolute;top:1.5px;left:1.5px;transition:left .15s}
.toggle.on .track{background:#c2410c}
.toggle.on .track .knob{left:11px}
.toggle.locked{cursor:default;opacity:0.7}

/* generation overlay */
.gen-overlay{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 40%,rgba(245,243,238,0.85) 0%,rgba(232,238,214,0.92) 55%,rgba(215,228,190,0.96) 100%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:genFadeIn 0.45s ease-out}
#probeGenCanvas{position:absolute;inset:0;width:100vw;height:100vh}
.gen-card{position:relative;z-index:2;pointer-events:none;text-align:center;padding:40px}
.gen-kicker{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#5b6d48;margin-bottom:14px;animation:genTextIn 0.6s ease-out both}
.gen-kicker .live{display:inline-block;width:6px;height:6px;background:#8fa878;border-radius:50%;box-shadow:0 0 10px #b8cc9a;margin-right:8px;vertical-align:middle;animation:breathe 1.1s ease-in-out infinite}
.gen-query{font-family:'Instrument Serif',serif;font-size:44px;font-style:italic;color:#1a1815;line-height:1.05;letter-spacing:-0.5px;max-width:640px;animation:genTextIn 0.7s ease-out 0.1s both}
.gen-stats{margin-top:28px;display:flex;justify-content:center;gap:16px;animation:fadeIn 0.6s ease-out 0.3s both;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#6b6d5a}
.gen-stats b{color:#c2410c;font-weight:400}
.gen-stats .sep{color:#c5c8b0}
.gen-bar{width:200px;height:2px;background:rgba(143,168,120,0.18);border-radius:2px;margin:22px auto 0;overflow:hidden}
.gen-bar > div{height:100%;background:linear-gradient(90deg,#8fa878,#c2410c);transform-origin:left;animation:lineGrow 3.1s ease-out forwards}

/* inspector */
.inspector{width:360px;flex-shrink:0;border-left:1px solid rgba(227,222,211,0.6);height:100vh;overflow-y:auto;animation:fadeIn 0.3s ease-out}
.insp-head{padding:20px 22px;border-bottom:1px solid rgba(227,222,211,0.6);display:flex;align-items:center;justify-content:space-between}
.insp-head .k{font-family:'JetBrains Mono',monospace;font-size:10px;color:#8a8478;letter-spacing:2px}
.insp-head .x{cursor:pointer;color:#8a8478;font-size:14px}
.insp-body{padding:22px;display:flex;flex-direction:column;gap:20px}
.insp-sec > .label{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#8a8478;letter-spacing:1.5px;margin-bottom:10px}
.card{background:#fff;border:1px solid #e3ded3;border-radius:12px;padding:14px}
.card + .card{margin-top:8px}
.card .stmt{font-size:12.5px;color:#1a1815;line-height:1.4}
.card .tag{font-family:'JetBrains Mono',monospace;font-size:9px;color:#8a8478;letter-spacing:1.5px;margin-bottom:6px;display:flex;justify-content:space-between}
.pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;padding:2px 7px;border-radius:20px;border:1px solid #d5cfc0;color:#6b665a}
.pill.matched{border-color:#5aa15a;color:#5aa15a}
.pill.superseded{opacity:0.55}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.kv .v{font-family:'Instrument Serif',serif;font-size:16px;color:#1a1815}
.kv .v.accent{color:#c2410c}
.kv .v.ok{color:#5aa15a;font-style:italic}
.kv .v.warn{color:#c2410c;font-style:italic}
.warnlist{margin:6px 0 0;padding-left:16px;font-size:11px;color:#9a2f08;line-height:1.4}
.muted{color:#8a8478;font-size:12px;line-height:1.5}
.err-note{color:#9a2f08;font-size:12px}
.branch-opt{font-size:11px;color:#8a8478;line-height:1.4;margin-top:5px;padding-left:2px;border-left:2px solid #e3ded3}
.branch-opt span{padding-left:7px;display:block}
.drawer{position:fixed;left:78px;top:0;width:360px;height:100vh;border-right:1px solid rgba(227,222,211,0.6);box-shadow:8px 0 40px rgba(30,41,59,0.06);overflow-y:auto;z-index:35;animation:fadeIn 0.25s ease-out}
.drawer.wide{width:min(1000px,calc(100vw - 78px))}
.sess-row{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12px;padding:9px 0;border-bottom:1px solid rgba(227,222,211,0.5)}
.sess-row .when{color:#1a1815}
.sess-row .turns{font-family:'JetBrains Mono',monospace;font-size:10px;color:#8a8478}
.sess-row.active{opacity:.55}
.learner-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;padding:10px 0;border-bottom:1px solid rgba(227,222,211,0.5);cursor:pointer}
.learner-row:hover{color:#c2410c}
.learner-row.current{color:#c2410c}
.learner-row .meta{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#8a8478}
.mini-input{width:100%;font-family:'Inter Tight',sans-serif;font-size:13px;color:#1a1815;background:#fff;border:1px solid #d5cfc0;border-radius:9px;padding:9px 11px;outline:none;margin-top:6px}
.mini-input:focus{border-color:#c2410c}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp-turn{border:1px solid #e3ded3;border-radius:10px;background:#fff;padding:10px 12px;font-size:12.5px;line-height:1.45}
.cmp-turn .who{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;color:#8a8478}
.cmp-turn .tutor{margin-top:6px;color:#1a1815}
.cmp-cost{font-family:'JetBrains Mono',monospace;font-size:10px;color:#8a8478;margin-top:6px}
.cmp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.cmp-head .mode{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid #d5cfc0;color:#6b665a}
.cmp-head .mode.diff{border-color:#c2410c;color:#c2410c}
.story-card{border:1px solid #e3ded3;border-radius:12px;background:#fff;padding:14px;margin-bottom:10px}
.story-card .meta{font-family:'JetBrains Mono',monospace;font-size:9px;color:#8a8478;letter-spacing:1px;margin-bottom:8px}
.story-card .sit{font-size:13px;color:#1a1815;line-height:1.45}
.story-card .res{font-size:12.5px;color:#5b5750;line-height:1.5;margin-top:6px}
.story-card .kind{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:1px;padding:2px 6px;border-radius:20px;border:1px solid #d5cfc0;color:#8a8478;margin-bottom:8px}
.btn{background:#c2410c;border:none;color:#fff;border-radius:9px;padding:8px 14px;font-size:12px;cursor:pointer;transition:background .15s}
.btn:hover{background:#9a2f08}
.btn.ghost{background:transparent;color:#c2410c;border:1px solid #d5cfc0;padding:5px 10px;border-radius:8px;font-size:11px}
.btn.ghost:hover{background:#fff;border-color:#c2410c}
.btn:disabled{opacity:.5;cursor:default}
.field{font-family:'JetBrains Mono',monospace;font-size:11px;color:#1a1815;background:#fff;border:1px solid #e3ded3;border-radius:8px;padding:8px 10px;word-break:break-all}
.ok-note{color:#5aa15a;font-size:12px;line-height:1.5}
@media (max-width:900px){.inspector{position:fixed;right:0;top:0;z-index:40;box-shadow:-8px 0 40px rgba(0,0,0,0.12)}.empty-hero .big{font-size:60px;letter-spacing:-2px}}
</style>
</head>
<body>
<div class="probe-bloom"></div>
<canvas id="probeBgCanvas"></canvas>

<div class="gen-overlay" id="genOverlay" hidden>
  <canvas id="probeGenCanvas"></canvas>
  <div class="gen-card">
    <div class="gen-kicker"><span class="live"></span>GENERATING BRANCHES · <span id="genPhase">root → level 1</span></div>
    <div class="gen-query">"<span id="genQuery"></span>"</div>
    <div class="gen-stats">
      <div>width <b>4</b></div><span class="sep">|</span>
      <div>depth <b>3</b></div><span class="sep">|</span>
      <div>calls <b id="genCalls">00</b>/<span id="genLimit">28</span></div>
    </div>
    <div class="gen-bar"><div></div></div>
  </div>
</div>

<div class="probe-shell shell">
  <!-- left rail -->
  <div class="probe-rail rail">
    <div class="probe-rail-glow"></div>
    <div class="rail-logo">
      <div style="position:absolute;inset:-6px;background:radial-gradient(circle,rgba(255,235,170,0.65) 0%,transparent 70%);filter:blur(4px)"></div>
      <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.9) 0%,rgba(245,247,232,0.75) 35%,rgba(213,225,190,0.6) 100%);border:1.5px solid rgba(143,168,120,0.55);box-shadow:inset -3px -4px 10px rgba(126,150,92,0.18),inset 3px 4px 8px rgba(255,255,255,0.7),0 4px 14px rgba(126,150,92,0.2);overflow:hidden">
        <div style="position:absolute;inset:8px;border:1px dashed rgba(143,168,120,0.45);border-radius:50%;animation:ringRotate 26s linear infinite">
          <div style="position:absolute;top:-6px;left:50%;margin-left:-6px;font-family:'Instrument Serif',serif;font-size:11px;color:#c2410c">π</div>
          <div style="position:absolute;top:50%;right:-6px;margin-top:-6px;font-family:'Instrument Serif',serif;font-style:italic;font-size:11px;color:#5b6d48">∫</div>
          <div style="position:absolute;bottom:-6px;left:50%;margin-left:-6px;font-family:'Instrument Serif',serif;font-size:11px;color:#c2410c">Σ</div>
          <div style="position:absolute;top:50%;left:-6px;margin-top:-6px;font-family:'Instrument Serif',serif;font-size:11px;color:#5b6d48">∞</div>
        </div>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;background:#c2410c;border-radius:50%;box-shadow:0 0 10px rgba(194,65,12,0.55)"></div>
      </div>
    </div>
    <button class="rail-btn" id="btnNew" title="new session">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5b6d48" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
    <button class="rail-btn" id="btnLearners" title="learners">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b665a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    </button>
    <button class="rail-btn" id="btnSession" title="sessions">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b665a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"></path><rect x="4" y="8" width="16" height="12" rx="2"></rect><path d="M2 14h2M20 14h2M15 13v2M9 13v2"></path></svg>
    </button>
    <button class="rail-btn" id="btnStory" title="learner memory">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b665a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    </button>
  </div>

  <!-- main -->
  <div class="main">
    <div class="topstrip">
      <div class="serif" style="font-size:20px">versa</div>
      <div class="dot"></div>
      <input class="learner-chip mono" id="learnerChip" value="alice-chen" spellcheck="false" autocomplete="off">
      <div class="dot" id="turnDotSep" hidden></div>
      <div class="mono" id="turnChip" style="font-size:11px;color:#8a8478" hidden></div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
        <div class="thinking-badge" id="thinkingBadge" hidden>
          <div style="width:6px;height:6px;background:#c2410c;border-radius:50%;animation:breathe 1s ease-in-out infinite"></div>
          <div class="mono" style="font-size:10px;color:#c2410c;letter-spacing:1.5px">GENERATING BRANCHES</div>
        </div>
      </div>
    </div>

    <div class="stream" id="stream">
      <div class="stream-inner" id="streamInner">
        <div class="empty-hero" id="emptyHero">
          <div class="big"><em>Probe</em> a mind.</div>
        </div>
      </div>
    </div>

    <div class="promptwrap">
      <div class="col">
        <div class="probe-panel promptbar">
          <input type="text" id="draft" placeholder="e.g. What's the difference between dy/dx and d/dx?" autocomplete="off">
          <button class="send-btn" id="sendBtn" title="send">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7h10M8 3l4 4-4 4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
        </div>
        <div class="prompt-meta">
          <div style="display:flex;align-items:center;gap:10px">
            <span>learner: <span id="learnerEcho">alice-chen</span></span>
          </div>
          <div id="promptHint">enter ↵ to send</div>
        </div>
      </div>
    </div>
  </div>

  <!-- left drawer: learners / sessions / learner memory -->
  <div class="probe-inspector drawer" id="drawer" hidden>
    <div class="insp-head">
      <div class="k" id="drawerTitle">PANEL</div>
      <div class="x" id="drawerClose">×</div>
    </div>
    <div class="insp-body" id="drawerBody"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
